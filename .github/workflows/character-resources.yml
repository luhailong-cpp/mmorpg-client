name: Character and pet resources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-resources:
    name: Resource checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            Assets/Scripts/World
            Assets/Resources/World/Characters/QdaoOriginalRosterV13
            Assets/Resources/World/Characters/QdaoOriginalRosterV14
            Assets/Resources/World/Characters/QdaoArchivedActions20261005
            Assets/Resources/World/Pets/QdaoPets20261005
      - name: Verify baseline images and exact delivery hashes
        run: python tools/verify_character_checkout.py --hash-images
      - name: Verify all archived character actions
        run: python tools/import_archived_actions.py --verify
      - name: Verify all archived pets
        run: python tools/import_pet_actions.py --verify
      - name: Check Git checkout and archive byte preservation
        run: python -m unittest discover -s tools/tests -p test_character_checkout.py -v
